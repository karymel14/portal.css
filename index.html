
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>URA TIN Registration Portal</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="portal.css">
</head>

<body>

    <!-- Page Header -->
    <header class="header">

        <img src="./images/ura-logo.png"
         alt="URA Logo" >

        <h1>TIN Registration Portal</h1>

    </header>

    <!-- Information Bar -->
    <div class="info-bar">
        Have your National ID ready before starting.
    </div>

    <!-- Main Form Area -->
    <main class="container">

        <h2>Taxpayer Registration</h2>

        <p class="instruction">
            Select the type of taxpayer to begin registration.
        </p>

        <!-- Taxpayer Type Toggle Buttons -->
        <div class="taxpayer-options">

            <input type="radio" id="individual"
                   name="taxpayerType" value="individual" checked>

            <label for="individual">
                Individual Taxpayer
            </label>

            <input type="radio" id="business"
                   name="taxpayerType" value="business">

            <label for="business">
                Business Entity
            </label>

        </div>

        <!-- Individual Taxpayer Form -->
        <form action="#" method="post" enctype="multipart/form-data">

            <fieldset>

                <legend>Section A: Individual Taxpayer Details</legend>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input type="text" id="fullName"
                           name="fullName" required>
                </div>

                <!-- NIN -->
                <div class="form-group">
                    <label for="nin">NIN</label>

                    <input type="text" id="nin" name="nin"
                           required minlength="14" maxlength="14"
                           pattern="[A-Z]{2}[A-Z0-9]{12}"
                           title="Enter two capital letters followed by 12 letters or digits.">
                </div>

                <!-- Date of Birth -->
                <div class="form-group">
                    <label for="dob">Date of Birth</label>

                    <input type="date" id="dob" name="dob">
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <div class="radio-group">

                        <input type="radio" id="male"
                               name="gender" value="Male">

                        <label for="male">Male</label>

                        <input type="radio" id="female"
                               name="gender" value="Female">

                        <label for="female">Female</label>

                    </div>
                </div>

                <!-- District -->
                <div class="form-group">
                    <label for="district">District</label>

                    <select id="district" name="district">

                        <option value="">Select District</option>
                        <option value="Kampala">Kampala</option>
                        <option value="Wakiso">Wakiso</option>
                        <option value="Mukono">Mukono</option>
                        <option value="Gulu">Gulu</option>
                        <option value="Mbarara">Mbarara</option>

                    </select>
                </div>

                <!-- Phone -->
                <div class="form-group">
                    <label for="phone">Phone</label>

                    <input type="tel" id="phone" name="phone"
                           required>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email">
                </div>

                <!-- National ID Upload -->
                <div class="form-group">
                    <label for="nationalID">Upload National ID</label>

                    <input type="file" id="nationalID"
                           name="nationalID"
                           accept=".jpg,.pdf">
                </div>

                <!-- Next Button -->
                <div class="button-container">

                    <button type="submit">Next</button>

                </div>

            </fieldset>

        </form>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Uganda Revenue Authority</p>
    </footer>

</body>
</html>
